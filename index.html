<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f1e4;
    --card: #efe4c8;
    --card-border: rgba(171, 138, 63, 0.28);
    --ink: #211d18;
    --ink-soft: #6b6153;
    --line: #d9cdb3;
    --gold: #ab8a3f;
    --auburn: #9e472a;
    --indigo: #2e4057;
    --plum: #7a3b54;
    --grey: #948a78;
    --vn-yellow: #ecca5c;
    --vn-yellow-bg: #f2d675;
    --vn-red: #a83226;
    --vn-red-border: rgba(168, 50, 38, 0.45);
    --serif: "Noto Serif", "Times New Roman", serif;
    --sans: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --toggle-h: 44px;
    --gutter: clamp(18px, 5vw, 24px);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    overflow-wrap: break-word;
  }

  a { color: inherit; }

  /* Generation word styling */
  .gen-marker {
    color: var(--auburn);
    font-weight: 600;
  }

  /* Crown icon styling */
  .crown-icon {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-left: 5px;
    vertical-align: middle;
    color: var(--gold);
    text-decoration: none !important;
  }

  /* Top bar: back link (left) + language toggle (right) */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--toggle-h);
    display: flex;
    align-items: center;
    z-index: 10;
    background: var(--paper);
    padding: 0 8px;
    border-bottom: 1px solid var(--line);
  }

  .top-back-link {
    display: inline-flex;
    align-items: center;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: none;
    background: none;
    border: none;
    padding: 10px 8px;
    margin: 0 2px;
    cursor: pointer;
    min-height: 32px;
  }

  .top-back-link:hover,
  .top-back-link:focus-visible {
    color: var(--ink);
  }

  .lang-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin-left: auto;
  }

  .lang-toggle button {
    background: none;
    border: none;
    padding: 10px 8px;
    margin: 0 2px;
    font: inherit;
    color: var(--grey);
    cursor: pointer;
    border-bottom: 1px solid transparent;
    min-width: 32px;
    min-height: 32px;
  }

  .lang-toggle button.active {
    color: var(--ink);
    border-bottom-color: var(--gold);
  }

  .lang-toggle button:focus-visible,
  .top-back-link:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--indigo);
    outline-offset: 2px;
  }

  /* Header & Color Key */
  .page-head {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(var(--toggle-h) + 16px) var(--gutter) 16px;
    text-align: left;
  }

  .page-head h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(22px, 6vw, 28px);
    margin: 0 0 6px;
  }

  .page-head p {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }

  .legend-key {
    max-width: 560px;
    margin: 0 auto 16px;
    padding: 0 var(--gutter);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink);
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    margin-top: 4px;
    border-radius: 50%;
    background-color: var(--auburn);
    flex-shrink: 0;
  }

  .legend-link {
    display: inline-block;
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1.5px solid var(--gold);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
    padding: 2px 0;
  }

  .legend-link:hover,
  .legend-link:focus-visible {
    border-bottom-color: var(--indigo);
    color: var(--indigo);
  }

  .legend-link:focus-visible {
    outline: 2px solid var(--indigo);
    outline-offset: 2px;
  }

  /* Tree view */
  .tree {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 var(--gutter) 20px;
  }

  .tree::before {
    content: "";
    position: absolute;
    z-index: 0;
    top: 38px;
    bottom: 38px;
    left: calc(var(--gutter) + 22px);
    width: 1px;
    background: var(--line);
  }

  .node {
    position: relative;
    z-index: 1;
    margin: 16px 0;
    padding: clamp(16px, 4vw, 20px) clamp(16px, 4vw, 22px);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
  }

  .person-row {
    display: flex;
    align-items: flex-start;
    gap: clamp(12px, 4vw, 18px);
    position: relative;
  }

  .person-row + .person-row { margin-top: 14px; }

  .icon-wrap {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    position: relative;
    z-index: 1;
  }

  .icon-wrap svg { width: 26px; height: 26px; display: block; }

  .person-info { padding-top: 6px; }

  .person-name {
    position: relative;
    font-family: var(--serif);
    font-size: clamp(17px, 4.5vw, 19px);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1.5px solid var(--gold);
    transition: border-color 0.15s ease, color 0.15s ease;
    cursor: pointer;
    background: none;
    padding: 0;
    display: inline;
  }

  /* Standalone note: visually detached from the lineage cards above it
     (smaller, centered, its own color) to signal it's not a blood relation. */
  .note-block-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 var(--gutter) 100px;
    display: flex;
    justify-content: center;
  }

  .note-block {
    display: inline-block;
    width: 100%;
    max-width: 200px;
    text-align: center;
    padding: 14px 16px;
    background: var(--vn-yellow-bg);
    border: 1px solid var(--vn-red-border);
    border-radius: 14px;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 15px;
    color: var(--vn-red);
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .note-block:hover,
  .note-block:focus-visible {
    border-color: var(--vn-red);
    background: var(--vn-yellow);
    outline: none;
  }

  .note-block:focus-visible {
    outline: 2px solid var(--vn-red);
    outline-offset: 2px;
  }

  /* Invisible hit-slop: enlarges the tap target on touch devices
     without changing the visible underline/box of the text itself. */
  .person-name::after {
    content: "";
    position: absolute;
    top: -10px;
    bottom: -6px;
    left: -6px;
    right: -6px;
  }

  .person-name:hover,
  .person-name:focus-visible {
    border-bottom-color: var(--indigo);
    color: var(--indigo);
  }

  .person-name:focus-visible {
    outline: 2px solid var(--indigo);
    outline-offset: 3px;
  }

  .person-name.is-placeholder {
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
  }

  .person-name.non-clickable {
    cursor: default;
    border-bottom: none;
  }

  .person-name.non-clickable:hover {
    color: var(--ink);
  }

  .person-title {
    display: block;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  /* Information / Person Detail View */
  .detail-page {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(var(--toggle-h) + 16px) var(--gutter) 100px;
  }

  .detail-header {
    display: flex;
    align-items: center;
    gap: clamp(12px, 4vw, 18px);
    margin-bottom: 28px;
  }

  .detail-header .icon-wrap {
    flex: 0 0 clamp(44px, 12vw, 56px);
    width: clamp(44px, 12vw, 56px);
    height: clamp(44px, 12vw, 56px);
    background: transparent;
  }

  .detail-header .icon-wrap svg { width: 70%; height: 70%; }

  .detail-header h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(22px, 6.5vw, 30px);
    margin: 0;
    overflow-wrap: break-word;
  }

  .detail-header h1.is-placeholder {
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
  }

  .detail-header .subtitle {
    display: block;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .detail-body {
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.75;
  }

  .detail-body p { margin: 0 0 1.2em; }
  .detail-body p:last-child { margin-bottom: 0; }

  .detail-body h2 {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    margin: 1.6em 0 0.8em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  .detail-body h2:first-child {
    margin-top: 0;
  }

  .detail-body h3 {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--auburn);
    margin: 1.5em 0 0.6em;
  }

  .detail-body ul {
    margin: 0 0 1.2em;
    padding-left: 0;
    list-style: none;
  }

  .detail-body li {
    position: relative;
    padding-left: 18px;
    margin: 0.5em 0;
  }

  .detail-body li::before {
    content: "\2013";
    position: absolute;
    left: 0;
    color: var(--gold);
  }

  /* Custom Executive Metadata Grid for Monarchs & Royal Figures */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px;
    margin: 0 0 24px;
    font-family: var(--sans);
  }

  .meta-item {
    display: flex;
    flex-direction: column;
  }

  .meta-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--auburn);
    margin-bottom: 2px;
  }

  .meta-value {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }

  /* Highlight class for highlighted ancestral lines */
  .highlight-auburn {
    color: var(--auburn);
    font-weight: 600;
  }

  /* Blockquote styling */
  .quote-poem-block {
    display: block;
    margin: 1.2em 0;
    padding: 14px 18px;
    background: var(--card);
    border-left: 4px solid var(--auburn);
    border-radius: 0 8px 8px 0;
    color: var(--auburn);
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
  }

  /* Info Page Custom Layout Components */
  .section-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 20px;
    margin: 1.5em 0;
  }

  .poem-box {
    text-align: center;
    background: rgba(255, 255, 255, 0.4);
    border: 1px dashed var(--gold);
    border-radius: 8px;
    padding: 16px;
    margin: 1.2em 0;
  }

  .poem-hanzi {
    font-family: var(--serif);
    font-size: 18px;
    letter-spacing: 0.3em;
    margin-bottom: 8px;
    color: var(--ink);
  }

  .poem-pinyin {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--auburn);
  }

  .poem-translation {
    font-size: 14px;
    font-style: italic;
    color: var(--ink-soft);
    margin-top: 10px;
  }

  .gender-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .badge-male {
    background-color: rgba(46, 64, 87, 0.12);
    color: var(--indigo);
  }

  .badge-female {
    background-color: rgba(122, 59, 84, 0.12);
    color: var(--plum);
  }

  .title-list {
    margin: 0.5em 0;
  }

  .title-item {
    display: flex;
    flex-direction: column;
    padding: 10px 0;
    border-bottom: 1px dotted var(--line);
  }

  .title-item:last-child {
    border-bottom: none;
  }

  .title-name {
    font-family: var(--serif);
    font-weight: 600;
    color: var(--plum);
  }

  .title-desc {
    font-size: 14px;
    color: var(--ink-soft);
  }

  /* Poem Character Meanings List */
  .char-meaning-list {
    list-style: none;
    padding-left: 0;
    margin: 1em 0;
  }

  .char-meaning-list li {
    padding-left: 0;
    margin: 0.4em 0;
    font-size: 15px;
  }

  .char-meaning-list li::before {
    content: none;
  }

  .char-word {
    font-weight: 600;
    color: var(--auburn);
    font-family: var(--sans);
  }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .person-name, .legend-link { transition: none; }
  }

  /* Small phones (e.g. SE, older Android) */
  @media (max-width: 380px) {
    .person-row { gap: 10px; }
    .person-row + .person-row { margin-top: 12px; }
  }

  @media (max-width: 420px) {
    .meta-grid { grid-template-columns: 1fr; }
  }

  /* Landscape phones: shrink the reserved top space a little */
  @media (max-height: 480px) and (orientation: landscape) {
    :root { --toggle-h: 40px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <button type="button" class="top-back-link" id="back-btn" hidden data-en="&larr; Back to family tree" data-vi="&larr; Về gia phả">&larr; Back to family tree</button>
  <div class="lang-toggle">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="vi">VI</button>
  </div>
</div>

<!-- TREE VIEW -->
<div id="view-tree">
  <header class="page-head">
    <h1 data-en="Family Tree" data-vi="Gia Phả">Family Tree</h1>
    <p data-en="Direct line of ancestors" data-vi="Dòng dõi trực hệ">Direct line of ancestors</p>
  </header>

  <div class="legend-key">
    <span class="legend-dot" aria-hidden="true"></span>
    <span>
      <span data-en="Indicates " data-vi="Chỉ ">Indicates </span>
      <span class="legend-link" role="link" tabindex="0" data-nav-info="royal-surnames"
            data-en="distinct royal generational surnames"
            data-vi="thế hệ đế tự hoàng gia">distinct royal generational surnames</span>
    </span>
  </div>

  <main class="tree" aria-label="Family tree"></main>

  <div class="note-block-wrap">
    <span class="note-block" role="link" tabindex="0" data-nav-info="song-hy" aria-label="Mè Xửng Song Hỷ — unrelated to family lineage">Mè Xửng Song Hỷ</span>
  </div>
</div>

<!-- DETAIL VIEW (PERSON & INFO PAGES) -->
<div id="view-detail" hidden>
  <main class="detail-page">
    <div class="detail-header">
      <div class="icon-wrap" data-field="icon"></div>
      <div>
        <h1 data-field="name"></h1>
        <span class="subtitle" data-field="title"></span>
      </div>
    </div>

    <div class="detail-body-wrap">
      <div class="detail-body" data-field="bio"></div>
    </div>

    <p class="not-found" hidden style="font-family: var(--sans); color: var(--ink-soft);"></p>
  </main>
</div>

<script>
/* Crown Icon SVG Constant */
const CROWN_ICON_SVG = `<svg class="crown-icon" viewBox="0 0 24 24" fill="currentColor" aria-label="Direct Royal Line" title="Direct Royal Line"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>`;

/* ---------------------------------------------------------
   INFO PAGES DATA
--------------------------------------------------------- */
const infoPages = {
  "song-hy": {
    name: {
      en: "Mè Xửng Song Hỷ",
      vi: "Mè Xửng Song Hỷ"
    },
    title: {
      en: "A Family Confectionery Legacy in Huế",
      vi: "Di Sản Bánh Kẹo Gia Truyền Xứ Huế"
    },
    bio: {
      en: `<p>Song Hỷ was originally established during the 1940s as a famous family confectionery brand in Huế, laying the foundation for traditional sesame candy craftsmanship in the region.</p>
<p>When taking over her family's workshop, Ms. Hồ Thị Hoa sought to preserve the legacy of Song Hỷ while turning Huế sesame candy into a signature culinary gift for travelers. In 1978, she officially transitioned the product line under the name Mè Xửng Thiên Hương, meaning "flavor of heaven," to honor the traditional heritage built by Song Hỷ and the culinary essence of the ancient capital.</p>
<p>Under Ms. Hoa's leadership, the heritage of Song Hỷ evolved from a small family operation into Thiên Hương Co., Ltd., growing from under 100 million VND in initial capital into a 20 billion VND enterprise. While modernizing packaging and refining recipes to reduce sweetness and highlight roasted sesame and peanut flavors, the company continues the core techniques derived from Song Hỷ. Today, the lineage of Song Hỷ through Thiên Hương consumes over 30 percent of Huế City's agricultural output annually, operating nationwide distribution and international export channels.</p>`,
      vi: `<p>Song Hỷ được thành lập vào những năm 1940, là một thương hiệu bánh kẹo gia truyền nổi tiếng tại Huế, đặt nền móng vững chắc cho nghề làm mè xửng truyền thống nơi xứ Kinh Kỳ.</p>
<p>Khi kế nghiệp xưởng sản xuất gia truyền, bà Hồ Thị Hoa luôn đau đáu nỗi niềm bảo tồn tinh hoa thương hiệu Song Hỷ, đồng thời đưa mè xửng trở thành món quà đặc sản mang nét đặc trưng của đất Thần Kinh. Đến năm 1978, bà chính thức chuyển đổi và đặt tên cho dòng sản phẩm của mình là Mè Xửng Thiên Hương, mang ý nghĩa "hương vị của trời", nhằm tôn vinh những giá trị truyền thống vốn có từ Song Hỷ và nét tinh túy ẩm thực của cố đô.</p>
<p>Dưới sự dẫn dắt của bà Hoa, nền tảng của Song Hỷ đã phát triển từ quy mô hộ cá thể thành Công ty TNHH Thiên Hương, nâng số vốn đầu tư từ chưa đến 100 triệu đồng ban đầu lên đến 20 tỷ đồng. Bên cạnh việc đổi mới mẫu mã bao bì và cải tiến công thức giảm độ ngọt để làm nổi bật vị thơm tự nhiên của mè rang và vị bùi béo của đậu phụng, công ty vẫn giữ trọn phương pháp sản xuất truyền thống kế thừa từ Song Hỷ. Ngày nay, tiếp nối chặng đường phát triển từ Song Hỷ, Thiên Hương tiêu thụ trên 30% sản lượng nông sản của thành phố Huế hàng năm, sở hữu hàng trăm đại lý trên khắp cả nước cùng các kênh xuất khẩu ra quốc tế.</p>`
    }
  },
  "royal-surnames": {
    icon: true,
    name: {
      en: "Distinct Royal Generational Surnames",
      vi: "Thế Hệ Đế Tự Hoàng Gia"
    },
    title: {
      en: "Nguyễn Imperial Naming System & Lineage",
      vi: "Hệ thống đặt tên & quy tắc xưng danh triều Nguyễn"
    },
    bio: {
      en: `<h2><span class="gender-badge badge-male">Male Lineage</span><br>Imperial Lineage & Male Naming Poems</h2>

<p>In 1823, Emperor Minh Mạng created the <em>Đế hệ thi</em> (Imperial Naming Poem) and ten <em>Phiên hệ thi</em> (Princes' Naming Poems) to regulate middle names and naming conventions for subsequent male generations of the royal family.</p>

<h3>The Imperial Naming Poem (Đế hệ thi)</h3>
<p>Consisting of 20 characters intended to serve as generational middle names for the direct imperial line (hoping the dynasty would span 20 generations or ~500 years):</p>

<div class="poem-box">
  <div class="poem-hanzi">綿 洪 膺 寶 永</div>
  <div class="poem-hanzi">保 貴 定 隆 長</div>

<p>Thuận Thiên Cao Hoàng hậu (tên thật là Trần Thị Đang, 1769–1846) là một trong những nhân vật có vị thế cao quý và ảnh hưởng sâu rộng nhất trong hậu cung nhà Nguyễn. Là người vợ gắn bó với Nguyễn Ánh (sau là vua Gia Long) từ thời kỳ bấp bênh gian khổ của cuộc nội chiến Tây Sơn, bà đã hạ sinh Hoàng tử Nguyễn Phúc Đảm - người sau này nối ngôi trở thành vua Minh Mạng. Nhờ tính cách cần kiệm, hiền đức và trí tuệ, bà giữ vị trí đứng đầu hậu cung suốt 32 năm qua ba đời vua (Gia Long, Minh Mạng, Thiệu Trị) với các tôn hiệu Hoàng thái hậu rồi Thái hoàng thái hậu. Bà không chỉ là điểm tựa tinh thần gia đình, luôn răn dạy các vua chốn triều chính phải thương dân, tiết kiệm, giữ gìn phép nước, mà còn trải qua niềm hạnh phúc hiếm có trong lịch sử hoàng gia khi chứng kiến cảnh "ngũ đại đồng đường" trước khi qua đời ở tuổi 77.</p>` } }

<h2>Administrative Reform & Governance</h2>
<p>Emperor Minh Mạng was the second ruler of the Nguyễn Dynasty and the primary architect of the imperial administrative state. Renowned for his tireless work ethic, administrative brilliance, and deep Confucian principles, he transformed Vietnam into one of the most powerful and highly structured empires in Southeast Asia during the 19th century.</p>

<h2>Major Contributions</h2>
<ul>
  <li><strong>Provincial Restructuring:</strong> Abolished Autonomous Regional Viceroys (Bắc Thành & Gia Định Thành) in 1831–1832, dividing the nation into 31 administrative provinces governed directly by imperial appointees.</li>
  <li><strong>Dynastic Lineage System:</strong> Authored the <em>Đế Hệ Thi</em> (Imperial Naming Poem) and rules for generational naming to ensure structured royal succession for future generations.</li>
  <li><strong>Institutional Expansion:</strong> Founded the <em>Nội Các</em> (Grand Secretariat) and expanded royal examinations to elevate bureaucratic competence.</li>
  <li><strong>Territorial Projection:</strong> Renamed the empire <em>Đại Nam</em> (大南) in 1838 and asserted significant regional influence across Indochina.</li>
</ul>

<p>Nguyễn Thị Thúy Trúc (Chinese characters: 阮氏翠竹; birth and death dates unknown), also known by the personal name Điện (電), held the rank of Fifth-Rank Concubine Lệ Tần (五階麗嬪) under Emperor Minh Mạng. She was born in Bình Sơn District, Quảng Ngãi Province, the daughter of Nguyễn Gia Quý, who held the military rank of Vice-Commander. Historical records do not specify whether she entered the emperor's service before or after his accession to the throne. In 1838, the 19th year of Minh Mạng's reign, she was formally conferred the title of Fifth-Rank Concubine Lệ Tần. Her date of death is unrecorded, but upon her passing she was bestowed the posthumous name Thục Tắc. Her tomb is located in the Trầm Bái area, now part of Thủy Xuân Ward, Huế, near the tombs of her two daughters, Princesses Trinh Nhàn and Nhu Nghi.</p>
<p>According to local folklore, Concubine Lệ Tần originally came from a commoner background. During a royal inspection tour by Emperor Minh Mạng, the local populace parted to make way for the royal procession, but a young woman holding a sickle for cutting grass remained indifferent and refused to step aside. Surprised, the emperor ordered his guards to bring her forward for questioning, and she answered with a poem:</p>
<blockquote class="quote-poem-block">"You ride grandly in your sedan chair, while I hold the crescent blade to guard the border."</blockquote>
<p>Seeing that she was beautiful, articulate, and possessed a charmingly stubborn demeanor, the emperor was moved to bring her into the imperial court, later promoting her to Fifth-Rank Concubine Lệ Tần.</p>

<p>Nguyễn Thị Thúy Trúc (chữ Hán: 阮氏翠竹; không rõ ngày tháng năm sinh, năm mất), còn có húy là Điện (電), phong hiệu Ngũ giai Lệ tần (五階麗嬪), là một cung tần của vua Minh Mạng nhà Nguyễn. Bà nguyên quán ở huyện Bình Sơn, tỉnh Quảng Ngãi. Phụ thân của bà là ông Nguyễn Gia Quý, giữ chức Phó Vệ úy. Thời gian bà vào hầu vua Minh Mạng từ lúc tiềm để hay sau khi đăng cơ đều không được sử sách ghi lại. Năm Minh Mạng thứ 19 (1838), bà được sắc phong làm Ngũ giai Lệ tần. Không rõ thời gian bà qua đời; khi mất, bà được ban thụy là Thục Tắc. Tẩm mộ của bà được táng tại khu vực Trầm Bái, nay thuộc địa phận phường Thủy Xuân, Huế. Gần đó là tẩm của hai bà công chúa Trinh Nhàn và Nhu Nghi, hai người con gái của bà.</p>
<p>Theo truyền thuyết dân gian kể lại, bà Lệ tần vốn xuất thân bình dân. Nhân một năm vua Minh Mạng đi tuần du, dân chúng thấy ngự giá đi qua đều dạt ra xa để tránh đường, duy chỉ một người con gái cầm liềm cắt cỏ vẫn dửng dưng không chịu tránh đường. Nhà vua lấy làm lạ, cho thị vệ bắt cô gái đó đến xét hỏi. Cô gái bèn than rằng:</p>
<blockquote class="quote-poem-block">"Chàng đi võng giá nghênh ngang, Thiếp cầm bán nguyệt giữ an cõi bờ."</blockquote>
<p>Nhà vua nhìn kỹ thấy cô gái rất đẹp, ăn nói có duyên, có vẻ bướng bỉnh dễ thương nên động lòng cho nạp vào cung và thăng làm Lệ tần ở hàng Ngũ giai.</p>

<p>Bà Lệ tần sinh cho vua Minh Mạng tổng cộng 6 hoàng tử và 2 hoàng nữ, tất cả đều sống qua tuổi trưởng thành:</p>

</ul>

<p>Prince Nguyễn Phúc Miên Chí (also rendered as Trí, Chinese characters: 阮福綿寘) was born on September 20, 1836 (the 10th day of the 8th lunar month in the year Bính Thân), as the 73rd son of Emperor Minh Mạng and the 6th child of Fifth-Rank Consort Lệ Tần (Nguyễn Thị Thúy Trúc). Growing up in his private residence, Prince Miên Chí studied classical histories and literature, acquiring a broad understanding of the classics.</p>

<h2>Royal Imperial Favors & Ennoblement</h2>
<p>In 1840 (the 21st year of Minh Mạng's reign), the Emperor commissioned gold animal figurines as gifts for the imperial princes. Prince Miên Chí was awarded a golden elephant weighing 3 taels and 2 mace.</p>
<p>In 1852 (the 5th year of Tự Đức's reign), he was officially ennobled as <strong>Vĩnh Lộc Quận Công</strong> (District Duke of Vĩnh Lộc).</p>

<h2>Incidents during Tự Đức's Reign</h2>
<p>In 1875 (the 28th year of Tự Đức's reign), District Duke Miên Chí borrowed 1,000 strings of cash (quan tiền) from the Nghĩa Thường public treasury to repair his residence, but spent it all within a month and requested an advance on 2 to 3 years of his salary. Miên Định, head of the Imperial Clan Court (Phủ Tôn Nhân) and Miên Chí's 3rd older brother, reported the matter to Emperor Tự Đức to prevent further negligence. The Emperor remarked that while ordinary people might be forgiven for lacking parental guidance, a royal prince must discipline himself to set an example for others, ordering that he be properly admonished.</p>

<p>Later, his second son with his secondary wife, Prince Hồng Cạnh (who had inherited the title <em>Kỳ ngoại hầu</em>), engaged in unauthorized financial transactions with an interpreter at the French Consulate. The Imperial Clan Court reported this to Emperor Tự Đức; consequently, Hồng Cạnh received 80 strokes of the cane, and District Duke Miên Chí was penalized with the forfeiture of one year's royal stipend.</p>

<h2>Lineage & Passing</h2>
<p>District Duke Miên Chí passed away on December 18, 1888 (the 16th day of the 11th lunar month in the 3rd year of Đồng Khánh's reign) at the age of 52. He was posthumously granted the title <strong>Cung Lượng</strong> (恭亮). His tomb is located on the northeastern slope of Ngự Bình Mountain (An Cựu Ward, Huế), while his ancestral shrine was established in An Quán Village (Hương Trà, Huế).</p>
<p>He was blessed with 13 sons and 18 daughters. His branch of the family was granted the character <em>Lập</em> (立) by Emperor Minh Mạng for naming subsequent generations.</p>

<h2>Các Sự Kiện Dưới Thời Tự Đức</h2>

<p>Về sau, người con trai thứ hai của ông với người vợ thứ là Công tử Hồng Cạnh (được tập phong Kỳ ngoại hầu) từng qua lại vay tiền với người thông ngôn ở sứ quán Pháp. Phủ Tôn Nhân đem việc tâu lên, kết quả Hồng Cạnh bị phạt 80 trượng, còn quận công Miên Chí bị phạt tước 1 năm bổng lộc.</p>

<p>Quận công Miên Chí có tổng cộng 13 con trai và 18 con gái. Phòng của ông được vua Minh Mạng ban cho bộ chữ <em>Lập</em> (立) để đặt tên cho các thế hệ con cháu sau này.</p>

<p>Người dân địa phương nơi bà sinh sống thường quen gọi bà bằng danh xưng trìu mến và kính trọng là "Bà Thầy", bởi vì phu quân của bà, ông Lý Trường Ích, là một thầy thuốc Đông y truyền thống.</p>

<h2>Thân Thế & Danh Xưng Hoàng Tộc</h2>
<p>Nguyễn Phước Công Tôn Nữ Thị Liên (chữ Hán: 阮福公孫女氏蓮) là một nữ giới thuộc Hoàng tộc nhà Nguyễn (阮), mang họ Nguyễn Phước / Nguyễn Phúc (阮福). Dựa theo quy tắc danh xưng hoàng tộc:</p>
<ul>
  <li>Bà là cháu hai đời (cháu nội / 孫女) của một vị Thân vương nhà Nguyễn.</li>
  <li>Hoặc tính theo dòng Hoàng đế, danh xưng <em>Công Tôn Nữ</em> chỉ người cháu 3 đời (chắt) của Hoàng đế.</li>
</ul>

<h2>Pháp Danh Phật Giáo</h2>

function findPersonById(id) {
  for (const node of familyTree) {
    for (const person of node.people) {
      if (person.id === id) return person;
    }
  }
  return null;
}

/* ---------------------------------------------------------
   Language
--------------------------------------------------------- */
function getLang() { return localStorage.getItem("tree-lang") || "en"; }
function setLang(lang) { localStorage.setItem("tree-lang", lang); }

function renderLangToggle() {
  const lang = getLang();
  document.querySelectorAll(".lang-toggle button").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

function applyStaticText(lang) {
  document.querySelectorAll("[data-en]").forEach((el) => {
    el.innerHTML = lang === "vi" ? el.dataset.vi : el.dataset.en;
  });
}

/* ---------------------------------------------------------
   Gender icons
--------------------------------------------------------- */
function genderIcon(gender) {
  if (gender === "male") {
    return `<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="13" cy="19" r="8" stroke="#2e4057" stroke-width="2.2"/>
      <path d="M18.5 13.5L26 6" stroke="#2e4057" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M19 6h7v7" stroke="#2e4057" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  if (gender === "female") {
    return `<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="12" r="8" stroke="#7a3b54" stroke-width="2.2"/>
      <path d="M16 20v9" stroke="#7a3b54" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M11.5 25h9" stroke="#7a3b54" stroke-width="2.2" stroke-linecap="round"/>
    </svg>`;
  }
  if (gender === "unknown") {
    return `<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="9" stroke="#948a78" stroke-width="2" stroke-dasharray="3 4"/>
    </svg>`;
  }
  return ``;
}

/* ---------------------------------------------------------
   Views
--------------------------------------------------------- */
function renderTree(lang) {
  const root = document.querySelector(".tree");
  const nonClickableIds = [
    "great-grandfather", "great-grandmother",
    "grandfather", "grandmother",
    "father", "mother",
    "me"
  ];

  root.innerHTML = familyTree.map((node) => {
    const rows = node.people.map((person) => {
      const isPlaceholder = !person.name;
      let label = isPlaceholder ? (person.placeholder ? person.placeholder[lang] : "") : person.name;
      const title = person.title ? person.title[lang] : "";
      const isNonClickable = nonClickableIds.includes(person.id);
      const iconHtml = genderIcon(person.gender);

      return `
        <div class="person-row">
          ${iconHtml ? `<div class="icon-wrap">${iconHtml}</div>` : ""}
          <div class="person-info">
            ${
              isNonClickable
                ? `<span class="person-name${isPlaceholder ? " is-placeholder" : ""} non-clickable">${label}</span>${person.isRoyalDirectLine ? CROWN_ICON_SVG : ""}`
                : `<span class="person-name${isPlaceholder ? " is-placeholder" : ""}" role="link" tabindex="0" data-nav="${encodeURIComponent(person.id)}">${label}</span>${person.isRoyalDirectLine ? CROWN_ICON_SVG : ""}`
            }
            ${title ? `<span class="person-title">${title}</span>` : ""}
          </div>
        </div>`;
    }).join("");
    return `<div class="node">${rows}</div>`;
  }).join("");
}

function renderPerson(lang, id) {
  const person = id ? findPersonById(id) : null;
  const nameEl = document.querySelector("[data-field='name']");
  const titleEl = document.querySelector("[data-field='title']");
  const bioEl = document.querySelector("[data-field='bio']");
  const iconEl = document.querySelector("[data-field='icon']");
  const notFoundEl = document.querySelector(".not-found");
  const headerEl = document.querySelector(".detail-header");
  const bioWrapEl = document.querySelector(".detail-body-wrap");

  if (!person) {
    headerEl.hidden = true;
    bioWrapEl.hidden = true;
    notFoundEl.hidden = false;
    notFoundEl.textContent = lang === "vi" ? "Không tìm thấy người này." : "This person could not be found.";
    return;
  }

  headerEl.hidden = false;
  bioWrapEl.hidden = false;
  notFoundEl.hidden = true;

  const isPlaceholder = !person.name;
  let label = isPlaceholder ? (person.placeholder ? person.placeholder[lang] : "") : person.name;

  iconEl.style.display = "";
  iconEl.innerHTML = genderIcon(person.gender);
  nameEl.innerHTML = label + (person.isRoyalDirectLine ? CROWN_ICON_SVG : "");
  nameEl.classList.toggle("is-placeholder", isPlaceholder);

  const title = person.title ? person.title[lang] : "";
  titleEl.textContent = title;
  titleEl.style.display = title ? "block" : "none";

  bioEl.innerHTML = person.bio[lang];
  document.title = `${label.replace(/<[^>]*>/g, '')} · ${lang === "vi" ? "Gia Phả" : "Family Tree"}`;
}

function renderInfoPage(lang, id) {
  const page = infoPages[id];
  const nameEl = document.querySelector("[data-field='name']");
  const titleEl = document.querySelector("[data-field='title']");
  const bioEl = document.querySelector("[data-field='bio']");
  const iconEl = document.querySelector("[data-field='icon']");
  const notFoundEl = document.querySelector(".not-found");
  const headerEl = document.querySelector(".detail-header");
  const bioWrapEl = document.querySelector(".detail-body-wrap");

  if (!page) {
    headerEl.hidden = true;
    bioWrapEl.hidden = true;
    notFoundEl.hidden = false;
    notFoundEl.textContent = lang === "vi" ? "Không tìm thấy trang này." : "Page could not be found.";
    return;
  }

  headerEl.hidden = false;
  bioWrapEl.hidden = false;
  notFoundEl.hidden = true;

  if (page.icon) {
    iconEl.style.display = "";
    iconEl.innerHTML = `<span class="legend-dot" style="width:24px; height:24px;"></span>`;
  } else {
    iconEl.style.display = "none";
    iconEl.innerHTML = "";
  }
  nameEl.innerHTML = page.name[lang];
  nameEl.classList.remove("is-placeholder");

  const title = page.title ? page.title[lang] : "";
  titleEl.textContent = title;
  titleEl.style.display = title ? "block" : "none";

  bioEl.innerHTML = page.bio[lang];
  document.title = `${page.name[lang]} · ${lang === "vi" ? "Gia Phả" : "Family Tree"}`;
}

/* ---------------------------------------------------------
   Routing (hash-based)
--------------------------------------------------------- */
let savedTreeScrollY = 0;

function route(options = {}) {
  const hash = window.location.hash;
  const lang = getLang();
  const personMatch = hash.match(/^#\/person\/(.+)$/);
  const infoMatch = hash.match(/^#\/info\/(.+)$/);
  const treeView = document.getElementById("view-tree");
  const detailView = document.getElementById("view-detail");
  const backBtn = document.getElementById("back-btn");
  const isDetail = !!(personMatch || infoMatch);

  if (personMatch) {
    treeView.hidden = true;
    detailView.hidden = false;
    backBtn.hidden = false;
    renderPerson(lang, decodeURIComponent(personMatch[1]));
  } else if (infoMatch) {
    treeView.hidden = true;
    detailView.hidden = false;
    backBtn.hidden = false;
    renderInfoPage(lang, decodeURIComponent(infoMatch[1]));
  } else {
    treeView.hidden = false;
    detailView.hidden = true;
    backBtn.hidden = true;
    renderTree(lang);
  }
  applyStaticText(lang);

  if (!options.preserveScroll) {
    // Returning to the tree (back button, browser back, etc.) restores
    // the scroll position the user had before they navigated away.
    // Entering a detail page always starts at the top.
    window.scrollTo(0, isDetail ? 0 : savedTreeScrollY);
  }
}

function navigateTo(path) {
  savedTreeScrollY = window.scrollY;
  window.location.hash = path;
}

document.addEventListener("click", (e) => {
  const personEl = e.target.closest("[data-nav]");
  if (personEl) navigateTo(`/person/${encodeURIComponent(personEl.dataset.nav)}`);

  const infoEl = e.target.closest("[data-nav-info]");
  if (infoEl) navigateTo(`/info/${encodeURIComponent(infoEl.dataset.navInfo)}`);
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const personEl = e.target.closest("[data-nav]");
  if (personEl) {
    e.preventDefault();
    navigateTo(`/person/${encodeURIComponent(personEl.dataset.nav)}`);
  }
  const infoEl = e.target.closest("[data-nav-info]");
  if (infoEl) {
    e.preventDefault();
    navigateTo(`/info/${encodeURIComponent(infoEl.dataset.navInfo)}`);
  }
});

document.querySelectorAll(".lang-toggle button").forEach((btn) => {
  btn.addEventListener("click", () => {
    const scrollY = window.scrollY;
    setLang(btn.dataset.lang);
    renderLangToggle();
    route({ preserveScroll: true });
    window.scrollTo(0, scrollY);
  });
});

document.getElementById("back-btn").addEventListener("click", () => {
  window.location.hash = "";
});

window.addEventListener("hashchange", route);

renderLangToggle();
route();
</script>
